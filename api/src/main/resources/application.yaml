spring:
  application:
    name: api
  jackson:
    default-property-inclusion: non_null
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pensa}
    username: ${DB_USER:pg}
    password: ${DB_PASSWORD:postgresql}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/pensa}
          
server:
  port: 8080
  servlet:
    context-path: /api
    
logging:
  level:
    root: INFO
    soqe.pensa: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

pensa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
